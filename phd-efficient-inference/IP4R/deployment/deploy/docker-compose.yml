services:

  # ── Tier A: lightweight, training-free, CPU-real-time ───────────────────────
  tier-a:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.tier-a
    image: ip4r:tier-a
    volumes:
      - ../data/samples:/app/data/samples
      - ../data/results:/app/data/results
    # override CMD at runtime:  docker compose run tier-a inspect data/samples/photo.jpg
    command: selfcheck

  # ── Tier A+B: adds Anomalib PatchCore / PaDiM unsupervised detection ────────
  tier-ab:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.tier-ab
    image: ip4r:tier-ab
    volumes:
      - ../data/samples:/app/data/samples
      - ../data/results:/app/data/results
      - ../data/good_bank:/app/data/good_bank   # populate before enabling tier_b
    # mount a custom config to flip tier_b.enabled: true
    # - ../config/tier_ab.yaml:/app/config/default.yaml
    command: selfcheck

  # ── FQCT inference server — serves up to 10 concurrent CM4 units ─────────
  fqct-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.fqct-server
    image: ip4r:fqct-server
    ports:
      - "8000:8000"          # LAN address maps directly; bind to 0.0.0.0 inside
    volumes:
      - ../data/jobs:/app/data/jobs      # job DB + uploaded videos (30-day retention)
      - ../config:/app/config            # hot-reload: POST /api/config writes here
    restart: unless-stopped
